<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-label="Original animated realistic pixel gaming controller">
<style>
*{shape-rendering:crispEdges}.bg{fill:#090c12}.grid{stroke:#1b2430;stroke-width:2}.body{fill:#252d38;stroke:#9aa7b7;stroke-width:5}.bodyHi{fill:#343e4c}.bodyDark{fill:#151b23}.edge{fill:#202832}.black{fill:#080b10}.white{fill:#e6edf3}.muted{fill:#687587}.blue{fill:#58a6ff}.cyan{fill:#39d9ff}.red{fill:#ff5a64}.green{fill:#4ade80}.purple{fill:#c084fc}.shine{fill:#b9c5d3}
@keyframes hover{0%,100%{transform:translateY(5px) rotate(0deg)}50%{transform:translateY(-8px) rotate(-.7deg)}}
@keyframes dpad{0%,100%{transform:translateY(0)}30%{transform:translateY(4px)}48%{transform:translateY(0)}}
@keyframes button{0%,100%{transform:translateY(0)}30%{transform:translateY(5px)}48%{transform:translateY(0)}}
@keyframes stickL{0%,100%{transform:translate(0,0)}25%{transform:translate(-4px,3px)}50%{transform:translate(3px,-3px)}75%{transform:translate(4px,1px)}}
@keyframes stickR{0%,100%{transform:translate(0,0)}30%{transform:translate(4px,-3px)}60%{transform:translate(-3px,3px)}}
@keyframes light{0%,100%{opacity:.2}50%{opacity:1}}@keyframes pulse{0%,100%{opacity:.1;transform:scale(1)}50%{opacity:.55;transform:scale(1.04)}}@keyframes scan{0%{transform:translateX(-150px);opacity:0}20%{opacity:.8}80%{opacity:.8}100%{transform:translateX(1150px);opacity:0}}@keyframes burst{0%,100%{transform:scale(.8);opacity:0}45%{opacity:.8}65%{transform:scale(1.25);opacity:0}}
.controller{animation:hover 3.6s ease-in-out infinite;transform-origin:500px 180px}.dpad{animation:dpad 1.55s steps(2) infinite}.b1{animation:button 1.05s steps(2) infinite}.b2{animation:button 1.05s .16s steps(2) infinite}.b3{animation:button 1.05s .32s steps(2) infinite}.b4{animation:button 1.05s .48s steps(2) infinite}.stickL{animation:stickL 2.2s steps(3) infinite}.stickR{animation:stickR 2.5s steps(3) infinite}.led{animation:light 1.5s ease-in-out infinite}.pulse{animation:pulse 2.4s ease-in-out infinite}.scan{animation:scan 4.8s linear infinite}.burst{animation:burst 2.8s steps(3) infinite}
</style>
