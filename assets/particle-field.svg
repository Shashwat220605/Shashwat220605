<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" role="img" aria-label="Animated developer particle field">
<style>
svg{shape-rendering:crispEdges}.p{fill:#58a6ff;animation:drift 4s ease-in-out infinite}.p2{fill:#c084fc;animation:drift 5s ease-in-out infinite reverse}.p3{fill:#39d9ff;animation:drift 3.5s ease-in-out infinite}.line{stroke:#58a6ff;stroke-width:1;opacity:.16;animation:fade 3s ease-in-out infinite}@keyframes drift{0%,100%{transform:translate(0,0);opacity:.35}50%{transform:translate(10px,-8px);opacity:1}}@keyframes fade{50%{opacity:.5}}
</style>
