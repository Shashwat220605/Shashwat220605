<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-label="Animated developer profile terminal for Shashwat Ghadge">
<style>
*{shape-rendering:crispEdges}.bg{fill:#0d1117}.panel{fill:#161b22;stroke:#30363d;stroke-width:3}.bar{fill:#21262d}.red{fill:#ff5f56}.yellow{fill:#ffbd2e}.green{fill:#27c93f}.text{fill:#c9d1d9;font-family:monospace;font-size:18px}.dim{fill:#8b949e;font-family:monospace;font-size:15px}.blue{fill:#58a6ff}.cyan{fill:#39d9ff}.purple{fill:#bc8cff}.cursor{fill:#58a6ff}.led{fill:#39d9ff}
@keyframes t1{0%,5%{clip-path:inset(0 100% 0 0)}18%,100%{clip-path:inset(0 0 0 0)}}
@keyframes t2{0%,20%{clip-path:inset(0 100% 0 0)}34%,100%{clip-path:inset(0 0 0 0)}}
@keyframes t3{0%,36%{clip-path:inset(0 100% 0 0)}50%,100%{clip-path:inset(0 0 0 0)}}
@keyframes t4{0%,52%{clip-path:inset(0 100% 0 0)}66%,100%{clip-path:inset(0 0 0 0)}}
@keyframes blink{0%,45%{opacity:1}46%,100%{opacity:0}}
@keyframes glow{0%,100%{opacity:.3}50%{opacity:1}}
.t1{animation:t1 10s steps(22,end) infinite}.t2{animation:t2 10s steps(22,end) infinite}.t3{animation:t3 10s steps(28,end) infinite}.t4{animation:t4 10s steps(30,end) infinite}.cursor{animation:blink .8s steps(1) infinite}.led{animation:glow 1.5s ease-in-out infinite}
</style>
<rect width="1000" height="420" rx="16" class="bg"/>
<rect x="18" y="18" width="964" height="384" rx="11" class="panel"/>
<rect x="18" y="18" width="964" height="38" rx="11" class="bar"/>
<circle cx="44" cy="37" r="6" class="red"/><circle cx="65" cy="37" r="6" class="yellow"/><circle cx="86" cy="37" r="6" class="green"/>
<circle cx="950" cy="37" r="5" class="led"/>
<text x="500" y="42" text-anchor="middle" class="dim">SHASHWAT@GITHUB • ~/profile</text>

<g class="t1"><text x="48" y="94" class="text"><tspan class="blue">$</tspan> whoami</text><text x="48" y="126" class="text"><tspan class="cyan">→</tspan> Shashwat Ghadge</text></g>
<g class="t2"><text x="48" y="166" class="text"><tspan class="blue">$</tspan> role</text><text x="48" y="198" class="text"><tspan class="purple">→</tspan> Computer Science Engineer</text></g>
<g class="t3"><text x="48" y="238" class="text"><tspan class="blue">$</tspan> skills</text><text x="48" y="270" class="text"><tspan class="cyan">→</tspan> C · C++ · Python · JavaScript</text></g>
<g class="t4"><text x="48" y="310" class="text"><tspan class="blue">$</tspan> stack</text><text x="48" y="342" class="text"><tspan class="green">→</tspan> React · Node.js · Three.js · Blender</text></g>
<rect x="48" y="363" width="10" height="19" class="cursor"/>
</svg>
