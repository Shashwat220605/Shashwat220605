<rect x="18" y="18" width="864" height="214" rx="10" class="panel"/>
<rect x="18" y="18" width="864" height="34" rx="10" class="bar"/>
<circle cx="42" cy="35" r="6" class="red"/><circle cx="62" cy="35" r="6" class="yellow"/><circle cx="82" cy="35" r="6" class="green"/>
<text x="450" y="39" text-anchor="middle" class="dim">SHASHWAT@GITHUB • ~/profile</text>
<g class="s1"><text x="42" y="82" class="text"><tspan class="blue">$</tspan> whoami</text><text x="42" y="107" class="text"><tspan class="cyan">→</tspan> Shashwat Ghadge</text><text x="42" y="130" class="dim">Computer Science Engineer • Full-Stack Developer</text></g>
<g class="s2"><text x="42" y="157" class="text"><tspan class="blue">$</tspan> skills</text><text x="42" y="182" class="text"><tspan class="purple">→</tspan> C · C++ · Python · JavaScript</text></g>
<g class="s3"><text x="42" y="207" class="text"><tspan class="blue">$</tspan> stack</text><text x="170" y="207" class="text"><tspan class="cyan">React · Node.js · Three.js · Blender</tspan></text></g>
<g class="s4"><text x="42" y="207" class="text"><tspan class="blue">$</tspan> focus</text><text x="170" y="207" class="text"><tspan class="green">AI · Algorithms · 3D · Software Engineering</tspan></text></g>
