<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-label="Animated developer profile terminal for Shashwat Ghadge">
<style>
*{shape-rendering:crispEdges}.bg{fill:#0d1117}.panel{fill:#161b22;stroke:#30363d;stroke-width:3}.bar{fill:#21262d}.red{fill:#ff5f56}.yellow{fill:#ffbd2e}.green{fill:#27c93f}.text{fill:#c9d1d9;font-family:monospace;font-size:18px}.dim{fill:#8b949e;font-family:monospace;font-size:15px}.blue{fill:#58a6ff}.cyan{fill:#39d9ff}.purple{fill:#bc8cff}.cursor{fill:#58a6ff}
@keyframes type1{0%,6%{clip-path:inset(0 100% 0 0)}22%,100%{clip-path:inset(0 0 0 0)}}
@keyframes type2{0%,22%{clip-path:inset(0 100% 0 0)}38%,100%{clip-path:inset(0 0 0 0)}}
@keyframes type3{0%,38%{clip-path:inset(0 100% 0 0)}54%,100%{clip-path:inset(0 0 0 0)}}
@keyframes type4{0%,54%{clip-path:inset(0 100% 0 0)}70%,100%{clip-path:inset(0 0 0 0)}}
@keyframes blink{0%,45%{opacity:1}46%,100%{opacity:0}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
.line1{animation:type1 10s steps(22,end) infinite}.line2{animation:type2 10s steps(20,end) infinite}.line3{animation:type3 10s steps(20,end) infinite}.line4{animation:type4 10s steps(22,end) infinite}.cursor{animation:blink .8s steps(1) infinite}.led{animation:glow 1.5s ease-in-out infinite}
</style>
<rect width="1000" height="360" rx="16" class="bg"/>
<rect x="18" y="18" width="964" height="324" rx="11" class="panel"/>
<rect x="18" y="18" width="964" height="38" rx="11" class="bar"/>
<circle cx="44" cy="37" r="6" class="red"/><circle cx="65" cy="37" r="6" class="yellow"/><circle cx="86" cy="37" r="6" class="green"/>
<circle cx="950" cy="37" r="5" class="led" fill="#39d9ff"/>
<text x="500" y="42" text-anchor="middle" class="dim">SHASHWAT@GITHUB • ~/profile</text>

<g class="line1"><text x="48" y="92" class="text"><tspan class="blue">$</tspan> whoami</text><text x="48" y="122" class="text"><tspan class="cyan">→</tspan> Shashwat Ghadge</text></g>
<g class="line2"><text x="48" y="158" class="text"><tspan class="blue">$</tspan> role</text><text x="48" y="188" class="text"><tspan class="purple">→</tspan> Computer Science Engineer</text></g>
<g class="line3"><text x="48" y="224" class="text"><tspan class="blue">$</tspan> skills</text><text x="48" y="254" class="text"><tspan class="cyan">→</tspan> C · C++ · Python · JavaScript</text></g>
<g class="line4"><text x="48" y="290" class="text"><tspan class="blue">$</tspan> stack</text><text x="48" y="320" class="text"><tspan class="green">→</tspan> React · Node.js · Three.js · Blender</text></g>
<rect x="820" y="303" width="10" height="19" class="cursor"/>
</svg>
