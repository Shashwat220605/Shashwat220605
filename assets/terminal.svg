<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-label="Animated developer profile terminal for Shashwat Ghadge">
<style>
*{shape-rendering:crispEdges}.bg{fill:#0d1117}.panel{fill:#161b22;stroke:#30363d;stroke-width:3}.bar{fill:#21262d}.red{fill:#ff5f56}.yellow{fill:#ffbd2e}.green{fill:#27c93f}.text{fill:#c9d1d9;font-family:monospace;font-size:17px}.dim{fill:#8b949e;font-family:monospace;font-size:14px}.blue{fill:#58a6ff}.cyan{fill:#39d9ff}.purple{fill:#bc8cff}.cursor{fill:#58a6ff}
@keyframes show1{0%,8%{opacity:0}12%,100%{opacity:1}}@keyframes show2{0%,25%{opacity:0}29%,100%{opacity:1}}@keyframes show3{0%,42%{opacity:0}46%,100%{opacity:1}}@keyframes show4{0%,59%{opacity:0}63%,100%{opacity:1}}@keyframes blink{0%,45%{opacity:1}46%,100%{opacity:0}}
.s1{opacity:0;animation:show1 7s steps(1) infinite}.s2{opacity:0;animation:show2 7s steps(1) infinite}.s3{opacity:0;animation:show3 7s steps(1) infinite}.s4{opacity:0;animation:show4 7s steps(1) infinite}.cursor{animation:blink .9s steps(1) infinite}
</style>
