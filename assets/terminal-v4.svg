<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-label="Animated developer profile terminal">
<style>
*{shape-rendering:crispEdges}.bg{fill:#0d1117}.panel{fill:#161b22;stroke:#30363d;stroke-width:3}.bar{fill:#21262d}.red{fill:#ff5f56}.yellow{fill:#ffbd2e}.green{fill:#27c93f}.blue{fill:#58a6ff}.cyan{fill:#39d9ff}.purple{fill:#bc8cff}.txt{fill:#c9d1d9;font-family:monospace;font-size:18px}.dim{fill:#8b949e;font-family:monospace;font-size:15px}.cursor{fill:#58a6ff}
@keyframes l1{0%,3%{clip-path:inset(0 100% 0 0)}18%{clip-path:inset(0 0 0 0)}18.01%,100%{clip-path:inset(0 0 0 0)}}
@keyframes l2{0%,20%{clip-path:inset(0 100% 0 0)}38%{clip-path:inset(0 0 0 0)}38.01%,100%{clip-path:inset(0 0 0 0)}}
@keyframes l3{0%,40%{clip-path:inset(0 100% 0 0)}52%{clip-path:inset(0 0 0 0)}52.01%,100%{clip-path:inset(0 0 0 0)}}
@keyframes l4{0%,54%{clip-path:inset(0 100% 0 0)}78%{clip-path:inset(0 0 0 0)}78.01%,100%{clip-path:inset(0 0 0 0)}}
@keyframes l5{0%,80%{clip-path:inset(0 100% 0 0)}88%{clip-path:inset(0 0 0 0)}88.01%,100%{clip-path:inset(0 0 0 0)}}
@keyframes l6{0%,90%{clip-path:inset(0 100% 0 0)}98%{clip-path:inset(0 0 0 0)}98.01%,100%{clip-path:inset(0 0 0 0)}}
.a{animation:l1 30s steps(6,end) infinite}.b{animation:l2 30s steps(15,end) infinite}.c{animation:l3 30s steps(4,end) infinite}.d{animation:l4 30s steps(25,end) infinite}.e{animation:l5 30s steps(6,end) infinite}.f{animation:l6 30s steps(29,end) infinite}
@keyframes c1{0%,3%{opacity:0;transform:translate(58.8px,76px)}3.01%{opacity:1;transform:translate(58.8px,76px)}18%{opacity:1;transform:translate(123.6px,76px)}18.01%,100%{opacity:0;transform:translate(123.6px,76px)}}
@keyframes c2{0%,20%{opacity:0;transform:translate(58.8px,108px)}20.01%{opacity:1;transform:translate(58.8px,108px)}38%{opacity:1;transform:translate(220.8px,108px)}38.01%,100%{opacity:0;transform:translate(220.8px,108px)}}
@keyframes c3{0%,40%{opacity:0;transform:translate(58.8px,148px)}40.01%{opacity:1;transform:translate(58.8px,148px)}52%{opacity:1;transform:translate(102px,148px)}52.01%,100%{opacity:0;transform:translate(102px,148px)}}
@keyframes c4{0%,54%{opacity:0;transform:translate(58.8px,180px)}54.01%{opacity:1;transform:translate(58.8px,180px)}78%{opacity:1;transform:translate(328.8px,180px)}78.01%,100%{opacity:0;transform:translate(328.8px,180px)}}
@keyframes c5{0%,80%{opacity:0;transform:translate(58.8px,220px)}80.01%{opacity:1;transform:translate(58.8px,220px)}88%{opacity:1;transform:translate(123.6px,220px)}88.01%,100%{opacity:0;transform:translate(123.6px,220px)}}
@keyframes c6{0%,90%{opacity:0;transform:translate(58.8px,252px)}90.01%{opacity:1;transform:translate(58.8px,252px)}98%{opacity:1;transform:translate(372px,252px)}98.01%,100%{opacity:0;transform:translate(372px,252px)}}
.c1{animation:c1 30s steps(6,end) infinite}.c2{animation:c2 30s steps(15,end) infinite}.c3{animation:c3 30s steps(4,end) infinite}.c4{animation:c4 30s steps(25,end) infinite}.c5{animation:c5 30s steps(6,end) infinite}.c6{animation:c6 30s steps(29,end) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.cur{animation:blink .7s steps(1) infinite}
@keyframes led{0%,100%{opacity:.3}50%{opacity:1}}.led{animation:led 1.5s ease-in-out infinite}
</style>
<rect width="1000" height="320" rx="16" class="bg"/><rect x="18" y="18" width="964" height="284" rx="11" class="panel"/><rect x="18" y="18" width="964" height="38" rx="11" class="bar"/>
<circle cx="44" cy="37" r="6" class="red"/><circle cx="65" cy="37" r="6" class="yellow"/><circle cx="86" cy="37" r="6" class="green"/><circle cx="950" cy="37" r="5" class="led" fill="#39d9ff"/>
<text x="500" y="42" text-anchor="middle" class="dim">SHASHWAT@GITHUB • ~/profile</text>
<g class="a"><text x="48" y="94" class="txt"><tspan class="blue">$</tspan> whoami</text></g>
<g class="b"><text x="48" y="126" class="txt"><tspan class="cyan">→</tspan> Shashwat Ghadge</text></g>
<g class="c"><text x="48" y="166" class="txt"><tspan class="blue">$</tspan> role</text></g>
<g class="d"><text x="48" y="198" class="txt"><tspan class="purple">→</tspan> Computer Science Engineer</text></g>
<g class="e"><text x="48" y="238" class="txt"><tspan class="blue">$</tspan> skills</text></g>
<g class="f"><text x="48" y="270" class="txt"><tspan class="cyan">→</tspan> C · C++ · Python · JavaScript</text></g>
<rect x="0" y="0" width="9" height="20" rx="1" class="cursor c1 cur"/><rect x="0" y="0" width="9" height="20" rx="1" class="cursor c2 cur"/><rect x="0" y="0" width="9" height="20" rx="1" class="cursor c3 cur"/><rect x="0" y="0" width="9" height="20" rx="1" class="cursor c4 cur"/><rect x="0" y="0" width="9" height="20" rx="1" class="cursor c5 cur"/><rect x="0" y="0" width="9" height="20" rx="1" class="cursor c6 cur"/>
</svg>
