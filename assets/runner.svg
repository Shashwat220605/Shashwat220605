<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" role="img" aria-label="Original pixel platform game animation">
<defs>
<style>
.pixel{shape-rendering:crispEdges}
.sky{fill:#87ceeb}.cloud{fill:#fff}.hill{fill:#58a85c}.ground{fill:#b86f3c}.brick{fill:#d8893d}.brickline{fill:#9a552e}.pipe{fill:#38a852}.pipeDark{fill:#22783b}.question{fill:#e7a52b}.questionDark{fill:#a96e18}.coin{fill:#ffd447}.coinDark{fill:#c99a19}.red{fill:#e53935}.blue{fill:#1677d2}.skin{fill:#f1b27a}.brown{fill:#6b3e26}.dark{fill:#20242a}
</style>
</defs>
<rect width="900" height="150" class="sky"/>
<g class="pixel">
<!-- clouds -->
<g class="cloud"><path d="M70 34h48v8h16v12H54V42h16zM360 25h38v8h18v13h-72V33h16zM690 38h42v8h18v12h-76V46h16z"/></g>
<!-- hills -->
<path d="M0 112h110V92h18V78h18v14h18v20h80v-26h18V72h18v14h18v26h80v-18h18V82h18v14h18v16h70v-28h18V70h18v12h18v30h260v20H0z" class="hill"/>
<!-- ground -->
<rect y="128" width="900" height="22" class="ground"/>
<path d="M0 128h900v5H0z" class="brickline"/>
<!-- bricks -->
<path d="M150 100h32v28h-32zM182 100h32v28h-32zM214 100h32v28h-32zM246 100h32v28h-32z" class="brick"/>
<path d="M150 112h128M182 100v12M214 112v16M246 100v12" fill="none" stroke="#9a552e" stroke-width="3"/>
<!-- question blocks -->
<g>
<rect x="300" y="58" width="28" height="28" rx="2" class="questionDark"/>
<rect x="304" y="54" width="28" height="28" rx="2" class="question"/>
<text x="313" y="75" font-family="monospace" font-size="20" font-weight="bold" fill="#fff">?</text>
</g>
<g>
<rect x="500" y="72" width="28" height="28" rx="2" class="questionDark"/>
<rect x="504" y="68" width="28" height="28" rx="2" class="question"/>
<text x="513" y="89" font-family="monospace" font-size="20" font-weight="bold" fill="#fff">?</text>
</g>
<!-- pipe -->
<path d="M650 88h38v40h-38zM644 82h50v12h-50z" class="pipe"/>
<path d="M650 94h8v34h-8z" class="pipeDark"/>
<!-- coin -->
<g>
<ellipse cx="315" cy="40" rx="7" ry="11" class="coinDark"/>
<ellipse cx="312" cy="38" rx="7" ry="11" class="coin"/>
<animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0;0 -8;0 0" dur="1.8s" repeatCount="indefinite"/>
</g>
<!-- character, one copy only -->
<g id="runner">
<g id="body">
<path d="M105 83h18v8h10v20h-8v17h-14v-17h-10v-20h4z" class="blue"/>
<path d="M109 70h24v18h-28V76h4z" class="red"/>
<path d="M104 76h8v8h-8zM126 76h8v8h-8z" class="skin"/>
<path d="M108 68h24v7h-24zM102 75h8v13h-8z" class="brown"/>
<path d="M112 88h20v8h-20z" class="skin"/>
<path d="M111 108h12v12h-12zM129 108h10v12h-10z" class="brown"/>
<path d="M107 120h16v8h-16zM130 120h14v8h-14z" class="dark"/>
</g>
<!-- jump arc -->
<animateTransform attributeName="transform" type="translate" values="0 0;65 -48;130 0;195 0;260 0;325 -48;390 0;455 0;520 0;585 -48;650 0;715 0" dur="7.2s" repeatCount="indefinite"/>
</g>
<!-- flag -->
<path d="M820 55h5v73h-5z" class="dark"/>
<path d="M825 58h42v25h-42z" class="red"/>
<path d="M825 83h42v6h-42z" class="cloud"/>
</g>
</svg>