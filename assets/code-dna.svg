<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" role="img" aria-label="Animated digital DNA code stream">
<style>
svg{shape-rendering:crispEdges} .code{font:14px monospace;fill:#58a6ff;opacity:.45}.bright{fill:#39d9ff;opacity:.9}.strand{fill:none;stroke:#c084fc;stroke-width:4;stroke-dasharray:8 12;animation:flow 3s linear infinite}.strand2{stroke:#58a6ff;animation-delay:-1.5s}.rung{stroke:#4ade80;stroke-width:2;opacity:.55;animation:pulse 1.8s steps(2) infinite}.scan{fill:#39d9ff;opacity:.12;animation:scan 5s linear infinite}@keyframes flow{to{stroke-dashoffset:-80}}@keyframes pulse{50%{opacity:1}}@keyframes scan{from{transform:translateX(-180px)}to{transform:translateX(1180px)}}
</style>
<rect width="1000" height="260" rx="18" fill="#090c12"/>
