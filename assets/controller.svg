<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Original animated pixel gaming controller">
<style>
*{shape-rendering:crispEdges}.bg{fill:#07090d}.grid{stroke:#171c26;stroke-width:2}.shell{fill:#171b24;stroke:#7d8796;stroke-width:5}.shellHi{fill:#252b36}.shadow{fill:#05070a}.edge{fill:#10141b}.white{fill:#e8edf5}.muted{fill:#8d98aa}.cyan{fill:#42d9ff}.blue{fill:#3388ff}.pink{fill:#d56bff}.red{fill:#ff5a5f}.green{fill:#55df78}.yellow{fill:#ffd34e}.purple{fill:#b48cff}.black{fill:#080b10}
@keyframes float{0%,100%{transform:translateY(4px) rotate(0deg)}50%{transform:translateY(-7px) rotate(-0.7deg)}}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
@keyframes press{0%,70%,100%{transform:translateY(0)}78%,88%{transform:translateY(5px)}}
@keyframes led{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes scan{0%{opacity:.05;transform:translateY(-120px)}50%{opacity:.14}100%{opacity:.05;transform:translateY(120px)}}
.controller{animation:float 3.2s ease-in-out infinite;transform-origin:600px 215px}.a{animation:press 1.5s ease-in-out infinite}.b{animation:press 1.5s .2s ease-in-out infinite}.x{animation:press 1.5s .4s ease-in-out infinite}.y{animation:press 1.5s .6s ease-in-out infinite}.led{animation:led 1.8s ease-in-out infinite}.spark{animation:pulse 1.6s ease-in-out infinite;transform-origin:center}.scan{animation:scan 4s linear infinite}
</style>
