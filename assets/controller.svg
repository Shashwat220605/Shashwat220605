<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" role="img" aria-label="Original animated gaming controller">
<style>
.bg{fill:#0d1117}.grid{stroke:#21262d;stroke-width:2}.shell{fill:#161b22;stroke:#8b949e;stroke-width:4}.shell2{fill:#21262d}.accent{fill:#58a6ff}.accent2{fill:#1f6feb}.white{fill:#f0f6fc}.dark{fill:#0d1117}.red{fill:#f85149}.yellow{fill:#d29922}.green{fill:#3fb950}.purple{fill:#bc8cff}
@keyframes float{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-5px) rotate(-1deg)}}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.18)}}
@keyframes press{0%,100%{transform:translateY(0)}45%{transform:translateY(3px)}60%{transform:translateY(0)}}
@keyframes blink{0%,35%,100%{opacity:.35}45%,70%{opacity:1}}
.controller{animation:float 2.8s ease-in-out infinite;transform-origin:450px 100px}.dot{animation:pulse 1.4s ease-in-out infinite;transform-origin:center}.btnA{animation:press 1.1s ease-in-out infinite}.btnB{animation:press 1.1s .2s ease-in-out infinite}.btnX{animation:press 1.1s .4s ease-in-out infinite}.btnY{animation:press 1.1s .6s ease-in-out infinite}.led{animation:blink 2s ease-in-out infinite}
</style>
<rect width="900" height="180" rx="18" class="bg"/>
<g opacity=".55" class="grid"><path d="M0 30h900M0 60h900M0 90h900M0 120h900M0 150h900"/><path d="M60 0v180M120 0v180M180 0v180M240 0v180M300 0v180M360 0v180M420 0v180M480 0v180M540 0v180M600 0v180M660 0v180M720 0v180M780 0v180M840 0v180"/></g>
<g class="controller">
  <path d="M220 116c7-45 25-73 59-73h55c24 0 47 9 116 9s92-9 116-9h55c34 0 52 28 59 73l7 36c4 20-18 29-32 14l-43-47c-8-9-19-14-31-14H319c-12 0-23 5-31 14l-43 47c-14 15-36 6-32-14z" class="shell"/>
  <path d="M287 58h326c13 0 23 8 27 20l7 22H280l7-22c4-12 14-20 27-20z" class="shell2"/>
  <circle cx="354" cy="112" r="25" class="dark" stroke="#8b949e" stroke-width="3"/>
  <circle cx="546" cy="112" r="25" class="dark" stroke="#8b949e" stroke-width="3"/>
  <path d="M354 94v36M336 112h36" stroke="#f0f6fc" stroke-width="8" stroke-linecap="round"/>
  <circle cx="625" cy="91" r="8" class="btnY" fill="#bc8cff"/><circle cx="648" cy="112" r="8" class="btnB" fill="#58a6ff"/><circle cx="602" cy="112" r="8" class="btnX" fill="#3fb950"/><circle cx="625" cy="133" r="8" class="btnA" fill="#f85149"/>
  <rect x="420" y="72" width="60" height="18" rx="9" class="dark" stroke="#8b949e" stroke-width="3"/>
  <circle cx="437" cy="81" r="4" class="led" fill="#58a6ff"/><circle cx="450" cy="81" r="4" class="led" fill="#3fb950"/><circle cx="463" cy="81" r="4" class="led" fill="#d29922"/>
  <circle cx="390" cy="58" r="5" class="dot" fill="#58a6ff"/><circle cx="510" cy="58" r="5" class="dot" fill="#58a6ff"/>
</g>
</svg>
