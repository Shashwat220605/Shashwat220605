<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" role="img" aria-label="Original pixel platform runner animation">
<style>
.pixel{shape-rendering:crispEdges}.sky{fill:#8ed6ff}.cloud{fill:#fff}.hill{fill:#55a85a}.ground{fill:#9b5a32}.groundTop{fill:#7c4528}.brick{fill:#c97838}.brickline{stroke:#7c4528;stroke-width:3}.red{fill:#e53935}.blue{fill:#1677d2}.skin{fill:#f0b27a}.brown{fill:#70452d}.dark{fill:#20242a}.coin{fill:#ffd83d}.coin2{fill:#c99b20}.block{fill:#e5a52b}.block2{fill:#a76d18}
@keyframes heroAction{0%,18%{transform:translate(0,0)}26%{transform:translate(38px,0)}31%{transform:translate(64px,-4px)}35%{transform:translate(72px,-12px)}39%{transform:translate(76px,-12px)}44%{transform:translate(84px,0)}62%,100%{transform:translate(0,0)}}
@keyframes blockBump{0%,30%{transform:translateY(0)}33%{transform:translateY(-10px)}37%{transform:translateY(0)}100%{transform:translateY(0)}}
@keyframes coinPop{0%,31%{transform:translateY(0);opacity:0}33%{transform:translateY(-8px);opacity:1}39%{transform:translateY(-34px);opacity:1}46%{transform:translateY(-50px);opacity:1}54%{transform:translateY(-25px);opacity:1}61%{transform:translateY(0);opacity:0}100%{opacity:0}}
@keyframes stepL{0%,100%{transform:translate(0,0)}50%{transform:translate(-4px,3px)}}
@keyframes stepR{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-2px)}}
.hero{animation:heroAction 3.5s ease-in-out infinite}.blockHit{animation:blockBump 3.5s ease-out infinite}.coinAnim{animation:coinPop 3.5s ease-out infinite}.legL{animation:stepL .35s steps(2) infinite}.legR{animation:stepR .35s steps(2) infinite}
</style>
<rect width="900" height="180" class="sky"/>
<g class="pixel">
<path d="M0 125h100V105h20V88h20v17h20v20h80V98h20V78h20v20h20v27h90V110h20V90h20v20h20v15h90V96h20V76h20v20h20v29h300v55H0z" class="hill"/>
<g class="cloud"><path d="M70 35h45V23h25v12h18v15H52V38h18zM370 52h50V35h24v17h18v14h-92zM690 30h42V18h24v12h18v15h-84z"/></g>
<rect x="0" y="145" width="900" height="35" class="ground"/>
<rect x="0" y="145" width="900" height="5" class="groundTop"/>
<path d="M0 157h900M0 169h900" stroke="#7c4528" stroke-width="2"/>

<!-- brick platform -->
<path d="M270 105h32v40h-32zM302 105h32v40h-32zM334 105h32v40h-32z" class="brick"/>
<path d="M270 125h96M302 105v20M334 125v20" fill="none" class="brickline"/>

<!-- first question block, directly above the runner's jump path -->
<g class="blockHit">
  <rect x="145" y="40" width="44" height="44" class="block2"/>
  <rect x="150" y="35" width="44" height="44" class="block"/>
  <text x="163" y="65" font-family="monospace" font-size="27" font-weight="bold" fill="white">?</text>
</g>

<!-- coin launches upward from inside the bumped block -->
<g class="coinAnim">
  <ellipse cx="172" cy="39" rx="7" ry="11" class="coin2"/>
  <ellipse cx="169" cy="36" rx="7" ry="11" class="coin"/>
</g>

<!-- second question block -->
<rect x="515" y="72" width="34" height="34" class="block2"/>
<rect x="510" y="67" width="34" height="34" class="block"/>
<text x="520" y="92" font-family="monospace" font-size="23" font-weight="bold" fill="white">?</text>

<!-- pipe -->
<path d="M665 105h44v40h-44zM658 98h58v13h-58z" fill="#35a853"/>
<path d="M665 112h9v33h-9z" fill="#23763b"/>

<!-- one original runner: jumps so his head meets the underside of the first block -->
<g class="hero">
  <path d="M82 91h34v8h6v20H78V99h4z" class="blue"/>
  <path d="M85 77h28v20H80V84h5z" class="red"/>
  <path d="M80 82h9v9h-9zM105 82h9v9h-9z" class="skin"/>
  <path d="M84 72h28v8H84zM78 79h10v14H78z" class="brown"/>
  <path d="M88 97h24v8H88z" class="skin"/>
  <g class="legL"><rect x="85" y="119" width="13" height="18" class="brown"/><rect x="80" y="137" width="20" height="7" class="dark"/></g>
  <g class="legR"><rect x="104" y="119" width="13" height="18" class="brown"/><rect x="102" y="137" width="20" height="7" class="dark"/></g>
</g>

<!-- finish flag -->
<path d="M815 72h6v73h-6z" class="dark"/>
<path d="M821 75h44v27h-44z" class="red"/>
<path d="M821 88h20v14h-20z" class="cloud"/>
</g>
</svg>
