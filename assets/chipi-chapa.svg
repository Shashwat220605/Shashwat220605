<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-label="Two detailed pixel art chipi chapa cats facing each other and dancing">
<style>
.pixel{shape-rendering:crispEdges}.cat{transform-box:fill-box;transform-origin:center bottom;animation:dance 1.05s steps(4,end) infinite}.right{animation-delay:-.525s}.tail{transform-box:fill-box;transform-origin:bottom center;animation:tail .7s steps(4,end) infinite alternate}.rt{animation-delay:-.35s}.ear{animation:ear .8s steps(2,end) infinite alternate}.re{animation-delay:-.4s}.heart{transform-box:fill-box;transform-origin:center;animation:pulse .9s steps(3,end) infinite alternate}.label{font:700 22px monospace;fill:#bc8cff}@keyframes dance{0%,100%{transform:translateY(0) rotate(-1deg)}25%{transform:translateY(-4px) rotate(1deg)}50%{transform:translateY(0) rotate(2deg)}75%{transform:translateY(-3px) rotate(-1deg)}}@keyframes tail{0%{transform:rotate(-13deg)}100%{transform:rotate(13deg)}}@keyframes ear{0%{transform:translateY(0)}100%{transform:translateY(3px)}}@keyframes pulse{0%{transform:translateY(0) scale(.9);opacity:.75}100%{transform:translateY(-6px) scale(1.08);opacity:1}}
</style>
<!-- left cat -->
<g class="cat" transform="translate(105 20)">
<!-- tail --> <g class="tail"><path class="pixel" fill="#756b5d" d="M92 245h-12v-9H67v-9H54v-18H43v-22h11v-13h13v-9h17v13H70v13h-9v20h12v10h15v-8h13v20H92z"/></g>
<!-- body --> <path class="pixel" fill="#b9b0a2" d="M92 156h18v-15h25v-10h60v10h25v15h13v73h-9v28h-18v12h-25v8h-61v-8H96v-12H78v-28h-9v-47h9v-17h14z"/>
<path class="pixel" fill="#e8dec9" d="M126 160h54v10h22v25h8v48h-17v28h-22v12h-37v-12h-22v-28h-9v-38h9v-30h14z"/>
<!-- head --> <path class="pixel" fill="#c7bca9" d="M74 77V43h13V20h30v13h20V23h40v10h20V20h30v23h13v34h12v65h-12v25h-19v16h-25v12h-65v-8h-27v-17H85v-28H69V91h5z"/>
<path class="pixel" fill="#eadfc9" d="M112 83h35v-8h43v9h29v17h12v43h-12v25h-22v15h-52v-9h-25v-14h-18v-30H90v-31h22z"/>
<!-- ears --> <path class="pixel ear" fill="#e3a3a3" d="M96 39h17v27h-9v10H92z"/><path class="pixel ear" fill="#e3a3a3" d="M191 66V39h18v37h-10V66z"/>
<!-- face --> <rect class="pixel" x="105" y="102" width="20" height="25" fill="#222"/><rect class="pixel" x="181" y="102" width="20" height="25" fill="#222"/><rect class="pixel" x="112" y="106" width="6" height="6" fill="#f4eee2"/><rect class="pixel" x="188" y="106" width="6" height="6" fill="#f4eee2"/>
<path class="pixel" fill="#222" d="M145 132h17v7h-5v7h-8v-7h-4zM138 146h10v5h12v-5h10v7h-10v6h-12v-6h-10z"/>
<!-- whiskers --> <path class="pixel" stroke="#3a3835" stroke-width="4" d="M91 128H43M91 141H38M207 128h48M207 141h53"/>
<!-- paws --> <path class="pixel" fill="#2b2927" d="M101 245h18v43h-7v9H94v-9h-7v-30h14zM180 245h18v13h7v30h-7v9h-18v-9h-7v-30h7z"/>
</g>
<!-- right cat -->
<g class="cat right" transform="translate(895 20) scale(-1 1)">
<g class="tail rt"><path class="pixel" fill="#8b603e" d="M92 245h-12v-9H67v-9H54v-18H43v-22h11v-13h13v-9h17v13H70v13h-9v20h12v10h15v-8h13v20H92z"/></g>
<path class="pixel" fill="#d4a66e" d="M92 156h18v-15h25v-10h60v10h25v15h13v73h-9v28h-18v12h-25v8h-61v-8H96v-12H78v-28h-9v-47h9v-17h14z"/>
<path class="pixel" fill="#f1dfbc" d="M126 160h54v10h22v25h8v48h-17v28h-22v12h-37v-12h-22v-28h-9v-38h9v-30h14z"/>
<path class="pixel" fill="#d9ae78" d="M74 77V43h13V20h30v13h20V23h40v10h20V20h30v23h13v34h12v65h-12v25h-19v16h-25v12h-65v-8h-27v-17H85v-28H69V91h5z"/>
<path class="pixel" fill="#f3dfba" d="M112 83h35v-8h43v9h29v17h12v43h-12v25h-22v15h-52v-9h-25v-14h-18v-30H90v-31h22z"/>
<path class="pixel ear re" fill="#e39a8c" d="M96 39h17v27h-9v10H92z"/><path class="pixel ear re" fill="#e39a8c" d="M191 66V39h18v37h-10V66z"/>
<rect class="pixel" x="105" y="102" width="20" height="25" fill="#222"/><rect class="pixel" x="181" y="102" width="20" height="25" fill="#222"/><rect class="pixel" x="112" y="106" width="6" height="6" fill="#f4eee2"/><rect class="pixel" x="188" y="106" width="6" height="6" fill="#f4eee2"/>
<path class="pixel" fill="#222" d="M145 132h17v7h-5v7h-8v-7h-4zM138 146h10v5h12v-5h10v7h-10v6h-12v-6h-10z"/>
<path class="pixel" stroke="#3a3835" stroke-width="4" d="M91 128H43M91 141H38M207 128h48M207 141h53"/>
<path class="pixel" fill="#59402f" d="M101 245h18v43h-7v9H94v-9h-7v-30h14zM180 245h18v13h7v30h-7v9h-18v-9h-7v-30h7z"/>
</g>
<!-- heart --> <g class="heart"><path class="pixel" fill="#ff789f" d="M466 116h12v-12h12v7h12v-7h12v12h12v24h-12v12h-12v12h-12v-12h-12v-12h-12z"/></g>
<text x="225" y="315" text-anchor="middle" class="label">chipi chapa</text><text x="775" y="315" text-anchor="middle" class="label">chipi chapa</text><text x="500" y="315" text-anchor="middle" class="label">&gt;&lt;</text>
</svg>