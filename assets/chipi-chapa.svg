<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-label="Two pixel art cats facing each other and wiggling">
<style>
.pixel{shape-rendering:crispEdges}.cat{transform-box:fill-box;transform-origin:center bottom;animation:wiggle .8s steps(2,end) infinite alternate}.cat2{animation-delay:-.4s}.tail{transform-box:fill-box;transform-origin:center bottom;animation:tail .65s steps(3,end) infinite alternate}.tail2{animation-delay:-.3s}.heart{transform-box:fill-box;transform-origin:center;animation:heart .9s steps(2,end) infinite alternate}.label{font:700 22px monospace;fill:#bc8cff}@keyframes wiggle{0%{transform:translateY(0) rotate(-2deg)}100%{transform:translateY(-5px) rotate(2deg)}}@keyframes tail{0%{transform:rotate(-10deg)}100%{transform:rotate(12deg)}}@keyframes heart{0%{transform:translateY(0) scale(1)}100%{transform:translateY(-5px) scale(1.08)}}
</style>
