<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-label="Two chipi chapa cats wiggling and facing each other">
<style>
.bg{fill:#0d1117}.cat1,.cat2{transform-box:fill-box;transform-origin:center bottom;animation:wiggle .9s ease-in-out infinite}.cat2{animation-delay:-.45s}.tail{transform-box:fill-box;transform-origin:bottom center;animation:tail .7s ease-in-out infinite alternate}.cat2 .tail{animation-delay:-.35s}.heart{animation:pulse 1.1s ease-in-out infinite}.txt{fill:#bc8cff;font:700 22px monospace}@keyframes wiggle{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-5px)}}@keyframes tail{0%{transform:rotate(-12deg)}100%{transform:rotate(15deg)}}@keyframes pulse{0%,100%{transform:scale(.9);opacity:.7}50%{transform:scale(1.1);opacity:1}}
</style>
<rect width="900" height="260" rx="20" class="bg"/>
<g class="cat1" transform="translate(130 25)">
