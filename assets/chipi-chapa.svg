 <path d="M142 122 Q150 128 158 122" fill="none" stroke="#252525" stroke-width="6" stroke-linecap="round"/>
 <path d="M135 139 Q150 151 165 139" fill="none" stroke="#252525" stroke-width="5" stroke-linecap="round"/>
 <path d="M75 120 L32 112 M76 133 L29 137 M211 120 L250 112 M212 134 L253 137" stroke="#252525" stroke-width="4" stroke-linecap="round"/>
 <g class="tail"><path d="M78 166 Q22 205 42 231 Q61 253 91 222" fill="none" stroke="#252525" stroke-width="15" stroke-linecap="round"/></g>
</g>
<g class="cat2" transform="translate(555 25) scale(-1 1) translate(-250 0)">
 <path d="M70 175 Q25 155 42 112 Q48 92 68 103 Q83 111 76 128 Q67 148 92 154" fill="#d6b27c" stroke="#252525" stroke-width="8"/>
 <path d="M72 88 L82 28 L116 61 Q145 48 174 61 L208 28 L216 91 Q229 112 218 149 Q204 190 146 190 Q87 190 72 150 Q61 113 72 88Z" fill="#e2c18d" stroke="#252525" stroke-width="8"/>
 <path d="M82 39 L91 70 L112 59Z M181 59 L202 39 L197 71Z" fill="#d99585"/>
 <ellipse cx="116" cy="101" rx="12" ry="15" fill="#252525"/><ellipse cx="182" cy="101" rx="12" ry="15" fill="#252525"/>
 <path d="M142 122 Q150 128 158 122" fill="none" stroke="#252525" stroke-width="6" stroke-linecap="round"/>
 <path d="M135 139 Q150 151 165 139" fill="none" stroke="#252525" stroke-width="5" stroke-linecap="round"/>
 <path d="M75 120 L32 112 M76 133 L29 137 M211 120 L250 112 M212 134 L253 137" stroke="#252525" stroke-width="4" stroke-linecap="round"/>
 <g class="tail"><path d="M78 166 Q22 205 42 231 Q61 253 91 222" fill="none" stroke="#252525" stroke-width="15" stroke-linecap="round"/></g>
</g>
