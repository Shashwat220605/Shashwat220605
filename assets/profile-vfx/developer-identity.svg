<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Shashwat Ghadge developer terminal</title>
  <desc id="desc">Terminal-style developer identity showing Shashwat Ghadge, skills and engineering focus.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="#263241"/>

  <circle cx="34" cy="30" r="6" fill="#ef4444"/>
  <circle cx="55" cy="30" r="6" fill="#f59e0b"/>
  <circle cx="76" cy="30" r="6" fill="#22c55e"/>
  <text x="105" y="35" fill="#64748b" font-family="monospace" font-size="16">shashwat@developer:~$ whoami</text>

  <text x="60" y="100" fill="#94a3b8" font-family="monospace" font-size="18">01</text>
  <text x="100" y="100" fill="#22c55e" font-family="monospace" font-size="18">$</text>
  <text x="125" y="100" fill="#e2e8f0" font-family="monospace" font-size="18">cat identity.txt</text>

  <text x="100" y="148" fill="#64748b" font-family="monospace" font-size="17">name:</text>
  <text x="180" y="148" fill="#f8fafc" font-family="monospace" font-size="22" font-weight="700">SHASHWAT GHADGE</text>

  <text x="100" y="190" fill="#64748b" font-family="monospace" font-size="17">role:</text>
  <text x="180" y="190" fill="#38bdf8" font-family="monospace" font-size="19">COMPUTER SCIENCE ENGINEER</text>

  <text x="100" y="232" fill="#64748b" font-family="monospace" font-size="17">skills:</text>
  <text x="180" y="232" fill="#e2e8f0" font-family="monospace" font-size="17">C++  Python  React  Node.js  TypeScript</text>

  <text x="100" y="274" fill="#64748b" font-family="monospace" font-size="17">focus:</text>
  <text x="180" y="274" fill="#e2e8f0" font-family="monospace" font-size="17">AI  Algorithms  Systems  3D  Full-Stack</text>

  <text x="100" y="316" fill="#64748b" font-family="monospace" font-size="17">mindset:</text>
  <text x="205" y="316" fill="#a78bfa" font-family="monospace" font-size="18">BUILD · EXPERIMENT · LEARN · SHIP</text>

  <text x="100" y="358" fill="#64748b" font-family="monospace" font-size="17">status:</text>
  <circle cx="190" cy="352" r="6" fill="#22c55e"/>
  <text x="207" y="358" fill="#22c55e" font-family="monospace" font-size="17">BUILDING</text>
  <text x="310" y="358" fill="#64748b" font-family="monospace" font-size="17">$</text>

  <text x="1060" y="100" fill="#334155" font-family="monospace" font-size="15">01</text>
  <text x="1060" y="145" fill="#334155" font-family="monospace" font-size="15">10</text>
  <text x="1060" y="190" fill="#334155" font-family="monospace" font-size="15">11</text>
  <text x="1060" y="235" fill="#334155" font-family="monospace" font-size="15">00</text>
  <text x="1060" y="280" fill="#334155" font-family="monospace" font-size="15">01</text>

  <rect x="60" y="388" width="1080" height="2" fill="#1e293b"/>
  <rect x="60" y="388" width="220" height="2" fill="url(#accent)"/>
</svg>