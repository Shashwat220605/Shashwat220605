<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" role="img" aria-label="Original animated pixel gaming controller">
<style>
*{shape-rendering:crispEdges}.bg{fill:#090c12}.panel{fill:#10151d;stroke:#303846;stroke-width:4}.body{fill:#202733;stroke:#697586;stroke-width:5}.body2{fill:#171d27}.edge{fill:#2b3441}.black{fill:#080b10}.white{fill:#e6edf3}.blue{fill:#58a6ff}.cyan{fill:#39d9ff}.red{fill:#ff5a64}.green{fill:#4ade80}.purple{fill:#c084fc}.yellow{fill:#f2cc60}.muted{fill:#7d8998}
@keyframes hover{0%,100%{transform:translateY(4px)}50%{transform:translateY(-7px)}}
@keyframes tilt{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-1deg)}}
@keyframes dpad{0%,100%{transform:translate(0,0)}35%{transform:translate(0,3px)}55%{transform:translate(0,0)}}
@keyframes button{0%,100%{transform:translateY(0)}40%{transform:translateY(5px)}58%{transform:translateY(0)}}
@keyframes light{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes scan{0%{transform:translateX(-120px);opacity:0}20%{opacity:.8}80%{opacity:.8}100%{transform:translateX(1120px);opacity:0}}
@keyframes pulse{0%,100%{opacity:.15}50%{opacity:.75}}
.controller{animation:hover 3.2s ease-in-out infinite,tilt 6.4s ease-in-out infinite;transform-origin:500px 135px}.dpad{animation:dpad 1.7s steps(2) infinite}.b1{animation:button 1.1s steps(2) infinite}.b2{animation:button 1.1s .18s steps(2) infinite}.b3{animation:button 1.1s .36s steps(2) infinite}.b4{animation:button 1.1s .54s steps(2) infinite}.led{animation:light 1.5s ease-in-out infinite}.scan{animation:scan 4.5s linear infinite}.pulse{animation:pulse 2s ease-in-out infinite}
</style>
<rect width="1000" height="260" rx="20" class="bg"/>
<path d="M40 34h920M40 226h920" stroke="#252c36" stroke-width="2" stroke-dasharray="8 12"/>
<g class="pulse" opacity=".4"><circle cx="500" cy="130" r="108" fill="none" stroke="#58a6ff" stroke-width="2" stroke-dasharray="3 12"/><circle cx="500" cy="130" r="122" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="2 18"/></g>
<g class="controller">
  <path d="M188 164c8-61 34-108 83-108h73c35 0 67 14 156 14s121-14 156-14h73c49 0 75 47 83 108l10 47c6 27-22 42-43 20l-59-63c-11-12-26-18-42-18H322c-16 0-31 6-42 18l-59 63c-21 22-49 7-43-20z" class="body"/>
  <path d="M272 77c18-18 41-26 68-26h320c27 0 50 8 68 26l19 35H253z" class="body2"/>
  <path d="M218 174c10-50 29-83 61-91l-28 96-42 52c-11 14-31 5-27-14zM782 174c-10-50-29-83-61-91l28 96 42 52c11 14 31 5 27-14z" class="edge"/>
  <ellipse cx="360" cy="143" rx="40" ry="34" class="black" stroke="#697586" stroke-width="4"/>
  <ellipse cx="640" cy="143" rx="40" ry="34" class="black" stroke="#697586" stroke-width="4"/>
  <circle cx="360" cy="143" r="25" fill="#151b23" stroke="#394453" stroke-width="3"/>
  <circle cx="640" cy="143" r="25" fill="#151b23" stroke="#394453" stroke-width="3"/>
  <g class="dpad"><path d="M290 104h20v26h26v20h-26v26h-20v-26h-26v-20h26z" class="white"/><path d="M294 108h12v22h22v12h-22v22h-12v-22h-22v-12h22z" class="muted"/></g>
  <g class="b1"><circle cx="710" cy="104" r="16" class="purple" stroke="#0b0e13" stroke-width="5"/><path d="M710 94v20M700 104h20" stroke="#fff" stroke-width="3"/></g>
  <g class="b2"><circle cx="748" cy="142" r="16" class="blue" stroke="#0b0e13" stroke-width="5"/><path d="M738 132l20 20M758 132l-20 20" stroke="#fff" stroke-width="3"/></g>
  <g class="b3"><circle cx="710" cy="180" r="16" class="red" stroke="#0b0e13" stroke-width="5"/><circle cx="710" cy="180" r="7" fill="none" stroke="#fff" stroke-width="3"/></g>
  <g class="b4"><circle cx="672" cy="142" r="16" class="green" stroke="#0b0e13" stroke-width="5"/><rect x="664" y="134" width="16" height="16" fill="none" stroke="#fff" stroke-width="3"/></g>
  <rect x="450" y="89" width="100" height="29" rx="14" class="black" stroke="#697586" stroke-width="4"/>
  <rect x="468" y="98" width="22" height="7" rx="3" class="white"/><rect x="510" y="98" width="22" height="7" rx="3" class="white"/>
  <circle cx="500" cy="137" r="10" class="black" stroke="#697586" stroke-width="3"/>
  <circle cx="500" cy="137" r="5" class="led" fill="#39d9ff"/>
  <path d="M437 61h126" stroke="#58a6ff" stroke-width="3" stroke-dasharray="4 8" opacity=".5"/>
  <circle cx="500" cy="61" r="5" class="led" fill="#58a6ff"/><circle cx="480" cy="61" r="4" class="led" fill="#c084fc"/><circle cx="520" cy="61" r="4" class="led" fill="#4ade80"/>
  <path d="M410 194h180" stroke="#303846" stroke-width="3"/>
  <path d="M430 194h140" stroke="#58a6ff" stroke-width="2" stroke-dasharray="5 8"/>
</g>
<rect x="0" y="127" width="1000" height="2" class="scan" opacity="0"/>
<g font-family="monospace" font-size="13" fill="#697586"><text x="52" y="58">PLAYER_01</text><text x="840" y="58">READY</text><text x="52" y="211">GAMING_MODE</text><text x="830" y="211">01:28:42</text></g>
</svg>