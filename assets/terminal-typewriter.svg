<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-label="Animated developer profile terminal">
<style>
*{shape-rendering:crispEdges}
.bg{fill:#0d1117}.panel{fill:#161b22;stroke:#30363d;stroke-width:3}.bar{fill:#21262d}
.red{fill:#ff5f56}.yellow{fill:#ffbd2e}.green{fill:#27c93f}
.txt{fill:#c9d1d9;font-family:monospace;font-size:18px}.dim{fill:#8b949e;font-family:monospace;font-size:15px}
.blue{fill:#58a6ff}.cyan{fill:#39d9ff}.purple{fill:#bc8cff}.cur{fill:#58a6ff}

@keyframes type1{0%,3%{clip-path:inset(0 100% 0 0)}12%,100%{clip-path:inset(0 0 0 0)}}
@keyframes type2{0%,13%{clip-path:inset(0 100% 0 0)}25%,100%{clip-path:inset(0 0 0 0)}}
@keyframes type3{0%,27%{clip-path:inset(0 100% 0 0)}34%,100%{clip-path:inset(0 0 0 0)}}
@keyframes type4{0%,36%{clip-path:inset(0 100% 0 0)}51%,100%{clip-path:inset(0 0 0 0)}}
@keyframes type5{0%,53%{clip-path:inset(0 100% 0 0)}60%,100%{clip-path:inset(0 0 0 0)}}
@keyframes type6{0%,62%{clip-path:inset(0 100% 0 0)}77%,100%{clip-path:inset(0 0 0 0)}}

.t1{animation:type1 14s steps(9,end) infinite}.t2{animation:type2 14s steps(17,end) infinite}
.t3{animation:type3 14s steps(6,end) infinite}.t4{animation:type4 14s steps(29,end) infinite}
.t5{animation:type5 14s steps(7,end) infinite}.t6{animation:type6 14s steps(32,end) infinite}

@keyframes cursorMove{
0%,2%{transform:translate(0px,0px)}
12%{transform:translate(95px,0px)}
13%{transform:translate(0px,72px)}
25%{transform:translate(180px,72px)}
27%{transform:translate(0px,112px)}
34%{transform:translate(60px,112px)}
36%{transform:translate(0px,144px)}
51%{transform:translate(300px,144px)}
53%{transform:translate(0px,184px)}
60%{transform:translate(70px,184px)}
62%{transform:translate(0px,216px)}
77%{transform:translate(340px,216px)}
80%,94%{transform:translate(340px,216px)}
95%,100%{transform:translate(0px,0px)}
}
.cursor{animation:cursorMove 14s steps(1,end) infinite}
@keyframes blink{0%,45%{opacity:1}46%,100%{opacity:0}}
@keyframes led{0%,100%{opacity:.3}50%{opacity:1}}
.blink{animation:blink .8s steps(1) infinite}.led{animation:led 1.5s ease-in-out infinite}
</style>

<rect width="1000" height="320" rx="16" class="bg"/>
<rect x="18" y="18" width="964" height="284" rx="11" class="panel"/>
<rect x="18" y="18" width="964" height="38" rx="11" class="bar"/>
<circle cx="44" cy="37" r="6" class="red"/><circle cx="65" cy="37" r="6" class="yellow"/><circle cx="86" cy="37" r="6" class="green"/>
<circle cx="950" cy="37" r="5" class="led" fill="#39d9ff"/>
<text x="500" y="42" text-anchor="middle" class="dim">SHASHWAT@GITHUB • ~/profile</text>

<text x="48" y="94" class="txt t1"><tspan class="blue">$</tspan> whoami</text>
<text x="48" y="126" class="txt t2"><tspan class="cyan">→</tspan> Shashwat Ghadge</text>

<text x="48" y="166" class="txt t3"><tspan class="blue">$</tspan> role</text>
<text x="48" y="198" class="txt t4"><tspan class="purple">→</tspan> Computer Science Engineer</text>

<text x="48" y="238" class="txt t5"><tspan class="blue">$</tspan> skills</text>
<text x="48" y="270" class="txt t6"><tspan class="cyan">→</tspan> C · C++ · Python · JavaScript</text>

<rect x="48" y="76" width="10" height="20" rx="1" class="cur cursor blink"/>
</svg>
